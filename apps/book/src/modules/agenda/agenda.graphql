# Agenda module operations — feature 011 (colocated with the module).

query Appointments(
  $tenantId: String
  $tenantSlug: String
  $startDate: String
  $endDate: String
  $specialistId: String
  $status: AppointmentStatus
) {
  appointments(
    tenantId: $tenantId
    tenantSlug: $tenantSlug
    startDate: $startDate
    endDate: $endDate
    specialistId: $specialistId
    status: $status
  ) {
    id
    tenantId
    serviceId
    specialistId
    clientName
    clientContact
    startAt
    endAt
    status
    appliedDurationMinutes
    appliedAmountCents
    appliedCurrency
    origin
    notes
    cancellationReason
    service {
      id
      name
    }
    specialist {
      id
      name
    }
  }
}

query Appointment($id: String!) {
  appointment(id: $id) {
    id
    tenantId
    serviceId
    specialistId
    clientName
    clientContact
    startAt
    endAt
    status
    appliedDurationMinutes
    appliedAmountCents
    appliedCurrency
    origin
    notes
    cancellationReason
    service {
      id
      name
    }
    specialist {
      id
      name
    }
  }
}

