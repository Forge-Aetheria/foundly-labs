# Agenda module operations — feature 011 (auth-scoped from 017).

query MyAppointments(
  $from: String!
  $to: String!
  $status: AppointmentStatus
  $specialistId: ID
) {
  myAppointments(from: $from, to: $to, status: $status, specialistId: $specialistId) {
    id
    tenantId
    serviceId
    specialistId
    clientName
    clientContact
    startAt
    endAt
    status
    appliedDurationMinutes
    appliedAmountCents
    appliedCurrency
    origin
    notes
    cancellationReason
    paymentMethodType
    advanceAmountCents
    paymentReference
    paymentProofUrl
    paymentSubmittedAt
    notifications {
      id
      kind
      message
      channel
      createdAt
    }
    service {
      id
      name
    }
    specialist {
      id
      name
    }
  }
}

