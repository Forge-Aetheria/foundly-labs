query Reviews($tenantSlug: String) {
  reviews(tenantSlug: $tenantSlug) {
    items {
      id
      author
      rating
      comment
      state
      createdAt
    }
    average
    count
  }
}

mutation AddReview($input: AddReviewInput!) {
  addReview(input: $input) {
    id
    author
    rating
    comment
    state
    createdAt
  }
}

query MyReviews($state: ReviewState) {
  myReviews(state: $state) {
    id
    author
    rating
    comment
    state
    createdAt
  }
}

mutation SetReviewState($id: ID!, $state: ReviewState!) {
  setReviewState(id: $id, state: $state) {
    id
    author
    rating
    comment
    state
    createdAt
  }
}

mutation DeleteReview($id: ID!) {
  deleteReview(id: $id)
}
