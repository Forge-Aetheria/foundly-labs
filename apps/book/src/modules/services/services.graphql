# Services module operations — feature 011 (colocated with the module).

query MyServices($active: Boolean) {
  myServices(active: $active) {
    id
    name
    description
    priceCents
    durationMinutes
    category
    active
  }
}

query MyService($id: ID!) {
  myService(id: $id) {
    id
    name
    description
    priceCents
    durationMinutes
    category
    active
  }
}

mutation CreateMyService($input: CreateMyServiceInput!) {
  createMyService(input: $input) {
    id
    name
    description
    priceCents
    durationMinutes
    category
    active
  }
}

mutation UpdateMyService($id: ID!, $input: UpdateMyServiceInput!) {
  updateMyService(id: $id, input: $input) {
    id
    name
    description
    priceCents
    durationMinutes
    category
    active
  }
}

mutation DeleteMyService($id: ID!) {
  deleteMyService(id: $id)
}