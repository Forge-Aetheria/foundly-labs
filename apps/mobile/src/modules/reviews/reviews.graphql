query MyReviews($state: ReviewState) {
  myReviews(state: $state) {
    id
    author
    rating
    comment
    state
    createdAt
  }
}

mutation SetReviewState($id: ID!, $state: ReviewState!) {
  setReviewState(id: $id, state: $state) {
    id
    author
    rating
    comment
    state
    createdAt
  }
}

mutation DeleteReview($id: ID!) {
  deleteReview(id: $id)
}
